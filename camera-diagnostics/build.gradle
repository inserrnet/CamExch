plugins {
    id "com.android.application"
}

android {
    namespace "com.camexch.cameradiagnostics"
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file("config/camexch-debug.p12")
            storePassword "camexch-debug"
            keyAlias "camexch-debug"
            keyPassword "camexch-debug"
            storeType "pkcs12"
        }
    }

    defaultConfig {
        applicationId "com.camexch.cameradiagnostics"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
