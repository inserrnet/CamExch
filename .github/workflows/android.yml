name: CamExch Suite

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test media pipeline
        run: gradle testDebugUnitTest

      - name: Validate browser camera hook
        run: node tools/check-virtual-camera-script.mjs

      - name: Android static analysis
        run: gradle lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camexch-lint-reports
          path: |
            source/build/reports/lint-results-debug.*
            browser/build/reports/lint-results-debug.*
            camera-diagnostics/build/reports/lint-results-debug.*

      - name: Build debug APKs
        run: gradle assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: camexch-debug-apks
          path: |
            source/build/outputs/apk/debug/*.apk
            browser/build/outputs/apk/debug/*.apk
            camera-diagnostics/build/outputs/apk/debug/*.apk

  cam-player:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: cam-player

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Microsoft DirectShow BaseClasses
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-classic-samples
          ref: 434f6002bdf9cf9829406c3ff2b33387982d6168
          path: windows-classic-samples
          sparse-checkout: Samples/Win7Samples/multimedia/directshow/baseclasses

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: cam-player/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Cam Player
        run: pnpm test

      - name: Test Electron WebRTC lifecycle
        run: pnpm test:electron

      - name: Build Windows virtual camera
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64 `
            -DBASECLASSES_DIR="$env:GITHUB_WORKSPACE/windows-classic-samples/Samples/Win7Samples/multimedia/directshow/baseclasses"
          cmake --build native/build --config Release --parallel
          cmake --install native/build --config Release --prefix native/bin/x64

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PnP camera driver
        shell: pwsh
        run: |
          msbuild pnp-driver\avssamp.vcxproj /restore /m `
            /p:Configuration=Release /p:Platform=x64 /p:SignMode=TestSign
          if ($LASTEXITCODE -ne 0) { throw "PnP camera driver build failed" }
          $package = "native/bin/x64/pnp"
          New-Item -ItemType Directory -Force $package | Out-Null
          foreach ($name in @("CamPlayerPnpCamera.sys", "CamPlayerPnpCamera.inf", "CamPlayerPnpCamera.cat")) {
            $file = Get-ChildItem pnp-driver -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) { throw "PnP camera package is missing $name" }
            Copy-Item $file.FullName (Join-Path $package $name) -Force
          }
          $certificate = Get-ChildItem pnp-driver -Recurse -File -Filter *.cer | Select-Object -First 1
          if ($certificate) { Copy-Item $certificate.FullName (Join-Path $package "CamPlayerPnpCamera.cer") -Force }

      - name: Test Windows virtual camera
        run: |
          node test/virtual-camera-native-smoke.js `
            native/bin/x64/CamPlayerVirtualCameraControl.exe `
            native/bin/x64/CamPlayerVirtualCamera.dll `
            node_modules/ffmpeg-static/ffmpeg.exe

      - name: Test Windows virtual camera in Chromium
        shell: pwsh
        run: |
          $control = "native/bin/x64/CamPlayerVirtualCameraControl.exe"
          $filter = "native/bin/x64/CamPlayerVirtualCamera.dll"
          & $control install $filter "Cam Player Camera"
          if ($LASTEXITCODE -ne 0) { throw "Virtual camera installation failed" }
          try {
            pnpm exec electron test/virtual-camera-chromium-smoke.js $control
            if ($LASTEXITCODE -ne 0) { throw "Chromium virtual camera test failed" }
          } finally {
            & $control uninstall
          }

      - name: Build portable Cam Player
        run: pnpm dist

      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist\Cam-Player-*-Windows-x64.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash
          "$hash  $($artifact.Name)" | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload Cam Player
        uses: actions/upload-artifact@v4
        with:
          name: cam-player-windows-x64
          path: |
            cam-player/dist/Cam-Player-*-Windows-x64.exe
            cam-player/dist/SHA256SUMS.txt
