<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; media-src 'self' file: blob:; img-src 'self' file: blob: data:; script-src 'self'; style-src 'self'">
  <title>Cam Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button id="openButton" class="command">Open</button>
    <select id="recentFiles" aria-label="Recent files">
      <option value="">Recent files</option>
    </select>
    <button id="clearRecentButton" class="icon" title="Clear recent files"
            aria-label="Clear recent files" disabled>&times;</button>
    <button id="scanQrButton" class="command" title="Select a screen area containing a QR code">Scan QR</button>
    <button id="playButton" class="icon" title="Play" aria-label="Play">&#9654;</button>
    <button id="pauseButton" class="icon" title="Pause" aria-label="Pause">&#10074;&#10074;</button>
    <label class="toggle"><input id="loopToggle" type="checkbox" checked> Loop</label>
    <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="timeLabel" class="mono">00:00 / 00:00</span>
  </header>

  <main>
    <section id="preview" class="preview" tabindex="0" aria-label="Output preview">
      <canvas id="outputCanvas" width="720" height="1280"></canvas>
      <div id="emptyState">Open a video or photo</div>
    </section>

    <aside class="settings">
      <h1>Cam Player</h1>

      <section>
        <h2>Output</h2>
        <div class="dimension-row">
          <label>Width <input id="widthInput" type="number" min="2" step="2" value="720"></label>
          <span>&times;</span>
          <label>Height <input id="heightInput" type="number" min="2" step="2" value="1280"></label>
          <button id="applySizeButton" class="icon" title="Apply output size" aria-label="Apply output size">&#10003;</button>
        </div>
        <label class="toggle wide">
          <input id="followSiteToggle" type="checkbox">
          Follow site and phone orientation
        </label>
        <label>Background blur <input id="blurInput" type="range" min="0" max="100" value="40"></label>
        <label>Maximum FPS <input id="fpsInput" type="number" min="1" max="60" value="60"></label>
      </section>

      <section>
        <h2>Transform</h2>
        <div class="button-row">
          <button id="resetSourceButton" class="command">Reset</button>
          <button id="fitPreviewButton" class="command">Show full frame</button>
          <button id="rotateButton" class="command">Rotate 90&deg;</button>
          <button id="mirrorButton" class="command" title="Flip left and right"
                  aria-label="Flip left and right" aria-pressed="false">Mirror</button>
        </div>
        <label>Motion mode
          <select id="motionMode">
            <option value="off">Off</option>
            <option value="live">Live phone</option>
            <option value="recorded">Recorded profile</option>
          </select>
        </label>
        <label class="toggle wide">
          <input id="liveMotionToggle" type="checkbox">
          Live Motion
        </label>
        <div class="profile-row">
          <label>Profile
            <select id="motionProfileSelect" disabled>
              <option value="">No saved profiles</option>
            </select>
          </label>
          <button id="openProfilesFolderButton" class="icon" title="Open profiles folder"
                  aria-label="Open profiles folder">&#128193;</button>
        </div>
        <label>Motion <span class="range-control"><input id="motionInput" type="range" min="0" max="100" value="35"><output id="motionValue">35</output></span></label>
        <label>Stabilization <span class="range-control"><input id="stabilizationInput" type="range" min="0" max="100" value="55"><output id="stabilizationValue">55</output></span></label>
        <div class="button-row">
          <button id="recenterButton" class="command">Recenter</button>
          <button id="recordMotionButton" class="command">Record Motion</button>
          <button id="cancelMotionRecordingButton" class="command" hidden>Cancel</button>
        </div>
        <div class="button-row">
          <button id="deleteMotionProfileButton" class="command" disabled>Delete</button>
        </div>
        <div id="motionRecordingStatus" class="recording-status" hidden></div>
        <p id="handheldStatus" class="hint">Waiting for phone motion</p>
        <p class="hint">Wheel: source scale. Drag: source position. Space + wheel/drag: preview.</p>
      </section>

      <section>
        <h2>Connection</h2>
        <div id="connectionStatus" class="status">Waiting for Source</div>
        <dl>
          <dt>Network</dt><dd id="networkValue" class="mono network-list">-</dd>
          <dt>Output</dt><dd id="outputValue" class="mono">720×1280 @ 30</dd>
          <dt>Peers</dt><dd id="peerValue">0</dd>
        </dl>
      </section>

      <section class="log-section">
        <div class="section-title">
          <h2>Log</h2>
          <div>
            <button id="copyLogButton" class="icon" title="Copy log" aria-label="Copy log">&#10697;</button>
            <button id="clearLogButton" class="icon" title="Clear log" aria-label="Clear log">&#10005;</button>
          </div>
        </div>
        <pre id="logOutput"></pre>
      </section>
    </aside>
  </main>

  <video id="videoSource" playsinline hidden></video>
  <img id="imageSource" alt="" hidden>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="../lib/geometry.js"></script>
  <script src="../lib/frame-cadence.js"></script>
  <script src="../lib/output-timeline.js"></script>
  <script src="../lib/handheld-motion.js"></script>
  <script src="../lib/motion-profile.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
