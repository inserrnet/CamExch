<!doctype html>
<meta charset="utf-8">
<canvas id="source"></canvas>
<video id="remote" muted autoplay playsinline></video>
<script src="../lib/frame-pacer.js"></script>
<script>
  "use strict";

  const { ipcRenderer } = require("electron");
  const canvas = document.getElementById("source");
  const video = document.getElementById("remote");
  const context = canvas.getContext("2d", { alpha: false });
  const progress = (message) => ipcRenderer.send("smoke-progress", message);

  const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

  async function waitForIce(peer) {
    if (peer.iceGatheringState === "complete") return;
    await new Promise((resolve) => {
      const timeout = setTimeout(resolve, 3000);
      peer.addEventListener("icegatheringstatechange", () => {
        if (peer.iceGatheringState === "complete") {
          clearTimeout(timeout);
          resolve();
        }
      });
    });
  }

  async function outboundStats(peer) {
    const report = await peer.getStats();
    let result = { frames: 0, width: 0, height: 0 };
    report.forEach((entry) => {
      if (entry.type !== "outbound-rtp"
          || (entry.kind || entry.mediaType) !== "video") return;
      result = {
        frames: Number(entry.framesEncoded) || 0,
        width: Number(entry.frameWidth) || 0,
        height: Number(entry.frameHeight) || 0,
      };
    });
    return result;
  }

  async function runCycle(width, height, cycle) {
    progress(`cycle=${cycle} begin size=${width}x${height}`);
    canvas.width = width;
    canvas.height = height;
    context.fillStyle = cycle % 2 ? "#f2f2f2" : "#202020";
    context.fillRect(0, 0, width, height);
    context.fillStyle = cycle % 2 ? "#202020" : "#f2f2f2";
    context.font = `${Math.max(24, Math.round(height / 12))}px sans-serif`;
    context.fillText(`static-${cycle}`, 24, Math.round(height / 2));

    const drawStaticFrame = () => {
      context.fillStyle = cycle % 2 ? "#f2f2f2" : "#202020";
      context.fillRect(0, 0, width, height);
      context.fillStyle = cycle % 2 ? "#202020" : "#f2f2f2";
      context.font = `${Math.max(24, Math.round(height / 12))}px sans-serif`;
      context.fillText(`static-${cycle}`, 24, Math.round(height / 2));
    };
    drawStaticFrame();
    let frameCanvas = canvas;
    let drawFrameForTransport = drawStaticFrame;
    if (cycle === 1) {
      const webglCanvas = document.createElement("canvas");
      const webgl = webglCanvas.getContext("webgl2", {
        alpha: false,
        antialias: false,
        desynchronized: true,
        preserveDrawingBuffer: false,
      });
      const transferCanvas = document.createElement("canvas");
      const transferContext = transferCanvas.getContext("2d", {
        alpha: false,
        desynchronized: true,
      });
      if (!webgl || !transferContext) throw new Error("production WebGL transfer unavailable");
      frameCanvas = transferCanvas;
      drawFrameForTransport = () => {
        webglCanvas.width = canvas.width;
        webglCanvas.height = canvas.height;
        transferCanvas.width = canvas.width;
        transferCanvas.height = canvas.height;
        webgl.viewport(0, 0, webglCanvas.width, webglCanvas.height);
        webgl.clearColor(0.1, 0.7, 0.3, 1);
        webgl.clear(webgl.COLOR_BUFFER_BIT);
        webgl.flush();
        transferContext.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);
      };
      progress("production WebGL to 2D transfer enabled preserveDrawingBuffer=false");
    }
    const track = new MediaStreamTrackGenerator({ kind: "video" });
    const writer = track.writable.getWriter();
    const stream = new MediaStream([track]);
    let timestampUs = 0;
    let writeChain = Promise.resolve();
    const present = () => {
      drawFrameForTransport();
      const frame = new VideoFrame(frameCanvas, { timestamp: timestampUs, duration: 100000 });
      timestampUs += 100000;
      writeChain = writeChain.then(() => writer.write(frame)).finally(() => frame.close());
    };
    progress(`cycle=${cycle} generated track state=${track.readyState}`);
    track.contentHint = "detail";
    const senderPeer = new RTCPeerConnection({ iceServers: [] });
    const receiverPeer = new RTCPeerConnection({ iceServers: [] });
    const remoteTrackPromise = new Promise((resolve) => {
      receiverPeer.ontrack = (event) => resolve(event.track);
    });
    receiverPeer.addTransceiver("video", { direction: "recvonly" });
    await receiverPeer.setLocalDescription(await receiverPeer.createOffer());
    progress(`cycle=${cycle} offer created`);
    await waitForIce(receiverPeer);
    await senderPeer.setRemoteDescription(receiverPeer.localDescription);
    senderPeer.addTrack(track, stream);
    await senderPeer.setLocalDescription(await senderPeer.createAnswer());
    await waitForIce(senderPeer);
    await receiverPeer.setRemoteDescription(senderPeer.localDescription);
    progress(`cycle=${cycle} answer applied`);
    for (let attempt = 0; attempt < 50
        && senderPeer.connectionState !== "connected"; attempt += 1) {
      await wait(100);
    }
    progress(
      `cycle=${cycle} connection sender=${senderPeer.connectionState} `
        + `receiver=${receiverPeer.connectionState}`,
    );
    if (senderPeer.connectionState !== "connected") {
      throw new Error(
        `cycle ${cycle} peer connection failed sender=${senderPeer.connectionState} `
          + `receiver=${receiverPeer.connectionState}`,
      );
    }

    const remoteTrack = await Promise.race([
      remoteTrackPromise,
      wait(5000).then(() => { throw new Error(`cycle ${cycle} remote track timeout`); }),
    ]);
    progress(`cycle=${cycle} remote track state=${remoteTrack.readyState} muted=${remoteTrack.muted}`);
    const clone = remoteTrack.clone();
    video.srcObject = new MediaStream([clone]);
    await wait(300);
    const bootstrapTimer = setInterval(present, 50);
    const playReady = await Promise.race([
      video.play().then(() => true, () => false),
      wait(1500).then(() => false),
    ]);
    progress(`cycle=${cycle} clone attached playReady=${playReady}`);

    let stats = { frames: 0, width: 0, height: 0 };
    for (let attempt = 0; attempt < 30; attempt += 1) {
      present();
      await wait(100);
      stats = await outboundStats(senderPeer);
      if (stats.frames > 0 && video.videoWidth === width && video.videoHeight === height) break;
    }
    if (stats.frames <= 0) throw new Error(`cycle ${cycle} encoded no static frame`);
    if (stats.width !== width || stats.height !== height) {
      throw new Error(
        `cycle ${cycle} encoded ${stats.width}x${stats.height}, expected ${width}x${height}`,
      );
    }
    if (video.videoWidth !== width || video.videoHeight !== height) {
      throw new Error(
        `cycle ${cycle} clone decoded ${video.videoWidth}x${video.videoHeight}, `
          + `expected ${width}x${height}`,
      );
    }
    const firstHeartbeatFrames = stats.frames;
    const heartbeatWaitMs = width * height >= 7_000_000 ? 2500 : 700;
    await wait(heartbeatWaitMs);
    stats = await outboundStats(senderPeer);
    if (stats.frames <= firstHeartbeatFrames) {
      throw new Error(
        `cycle ${cycle} static heartbeat stalled at ${firstHeartbeatFrames} frames`,
      );
    }
    if (cycle === 1) {
      canvas.width = 480;
      canvas.height = 640;
      for (let attempt = 0; attempt < 30; attempt += 1) {
        present();
        await wait(100);
        stats = await outboundStats(senderPeer);
        if (stats.width === 480 && stats.height === 640
            && video.videoWidth === 480 && video.videoHeight === 640) break;
      }
      if (stats.width !== 480 || stats.height !== 640
          || video.videoWidth !== 480 || video.videoHeight !== 640) {
        throw new Error(
          `cycle ${cycle} live resize failed encoded=${stats.width}x${stats.height} `
            + `decoded=${video.videoWidth}x${video.videoHeight}`,
        );
      }
      progress(`cycle=${cycle} live resize decoded=480x640 track=${track.id}`);
    }
    clearInterval(bootstrapTimer);
    progress(`cycle=${cycle} encoded frames=${stats.frames}`);

    video.srcObject = null;
    clone.stop();
    remoteTrack.stop();
    senderPeer.close();
    receiverPeer.close();
    await writer.close().catch(() => {});
    stream.getTracks().forEach((candidate) => candidate.stop());
    return { cycle, width, height, frames: stats.frames };
  }

  async function runLatestFrameCadenceCycle() {
    progress("latest-frame cadence begin fps=24");
    const producerCanvas = document.createElement("canvas");
    producerCanvas.width = 640;
    producerCanvas.height = 480;
    const producerGl = producerCanvas.getContext("webgl2", {
      alpha: false,
      antialias: false,
      preserveDrawingBuffer: false,
    });
    const transferCanvas = document.createElement("canvas");
    transferCanvas.width = 640;
    transferCanvas.height = 480;
    const transferContext = transferCanvas.getContext("2d", {
      alpha: false,
      desynchronized: true,
    });
    if (!producerGl || !transferContext) {
      throw new Error("Production WebGL transfer surfaces are unavailable");
    }
    const track = new MediaStreamTrackGenerator({ kind: "video" });
    const writer = track.writable.getWriter();
    const stream = new MediaStream([track]);
    const senderPeer = new RTCPeerConnection({ iceServers: [] });
    const receiverPeer = new RTCPeerConnection({ iceServers: [] });
    const remoteTrackPromise = new Promise((resolve) => {
      receiverPeer.ontrack = (event) => resolve(event.track);
    });
    receiverPeer.addTransceiver("video", { direction: "recvonly" });
    await receiverPeer.setLocalDescription(await receiverPeer.createOffer());
    await waitForIce(receiverPeer);
    await senderPeer.setRemoteDescription(receiverPeer.localDescription);
    senderPeer.addTrack(track, stream);
    await senderPeer.setLocalDescription(await senderPeer.createAnswer());
    await waitForIce(senderPeer);
    await receiverPeer.setRemoteDescription(senderPeer.localDescription);
    for (let attempt = 0; attempt < 50
        && senderPeer.connectionState !== "connected"; attempt += 1) await wait(100);
    const remoteTrack = await remoteTrackPromise;
    video.srcObject = new MediaStream([remoteTrack]);
    let latestFrame = 0;
    let timestampUs = 0;
    let writeChain = Promise.resolve();
    const transmitLatest = (tick) => {
      producerGl.clearColor((latestFrame % 255) / 255, 40 / 255, 80 / 255, 1);
      producerGl.clear(producerGl.COLOR_BUFFER_BIT);
      producerGl.flush();
      transferContext.drawImage(producerCanvas, 0, 0);
      const durationUs = Math.round(tick.intervalMs * 1000);
      const frame = new VideoFrame(transferCanvas, { timestamp: timestampUs, duration: durationUs });
      timestampUs += durationUs;
      writeChain = writeChain.then(() => writer.write(frame)).finally(() => frame.close());
    };
    const productionPacer = new CamFramePacer.Pacer({ onTick: transmitLatest });
    productionPacer.configure({ active: true, fps: 30, immediate: true, reason: "motion-pause" });
    await video.play();
    const capturedFrame = await new Promise((resolve, reject) => {
      video.requestVideoFrameCallback((_now, metadata) => {
        try {
          resolve(new VideoFrame(video, {
            timestamp: Math.max(0, Math.round(Number(metadata.mediaTime || 0) * 1_000_000)),
          }));
        } catch (error) {
          reject(error);
        }
      });
      productionPacer.wake("bootstrap");
    });
    const uploadCanvas = document.createElement("canvas");
    uploadCanvas.width = capturedFrame.displayWidth;
    uploadCanvas.height = capturedFrame.displayHeight;
    const uploadGl = uploadCanvas.getContext("webgl2");
    const uploadTexture = uploadGl.createTexture();
    uploadGl.bindTexture(uploadGl.TEXTURE_2D, uploadTexture);
    uploadGl.texImage2D(
      uploadGl.TEXTURE_2D, 0, uploadGl.RGBA,
      capturedFrame.displayWidth, capturedFrame.displayHeight,
      0, uploadGl.RGBA, uploadGl.UNSIGNED_BYTE, null,
    );
    uploadGl.texSubImage2D(
      uploadGl.TEXTURE_2D, 0, 0, 0,
      uploadGl.RGBA, uploadGl.UNSIGNED_BYTE, capturedFrame,
    );
    if (uploadGl.getError() !== uploadGl.NO_ERROR) {
      throw new Error("WebCodecs VideoFrame WebGL upload failed");
    }
    capturedFrame.close();
    progress("WebCodecs VideoFrame WebGL upload ready=true");
    const presentedAt = [];
    let observing = true;
    const observe = (now) => {
      if (!observing) return;
      presentedAt.push(now);
      video.requestVideoFrameCallback(observe);
    };
    video.requestVideoFrameCallback(observe);
    // Exercise the production transition that previously left a motion sender
    // and heartbeat competing with playback.
    productionPacer.configure({ active: true, fps: 24, immediate: true, reason: "play" });
    for (let index = 1; index <= 72; index += 1) {
      latestFrame = index;
      await wait(index % 2 === 0 ? 10 : 73);
    }
    await wait(500);
    productionPacer.configure({ active: false, fps: 24, reason: "complete" });
    observing = false;
    const intervals = presentedAt.slice(1).map((value, index) => value - presentedAt[index])
      .sort((a, b) => a - b);
    const p95 = intervals[Math.floor(intervals.length * 0.95)] || 0;
    progress(`latest-frame cadence frames=${presentedAt.length} p95Ms=${p95.toFixed(1)}`);
    // Shared GitHub runners use software WebGL and can miss one 24 FPS presentation slot.
    if (presentedAt.length < 55 || p95 > 85) {
      throw new Error(`latest-frame cadence unstable frames=${presentedAt.length} p95Ms=${p95}`);
    }
    video.srcObject = null;
    remoteTrack.stop();
    senderPeer.close();
    receiverPeer.close();
    await writer.close().catch(() => {});
    stream.getTracks().forEach((candidate) => candidate.stop());
    return { cycle: "latest-frame-24", frames: presentedAt.length, p95Ms: p95 };
  }

  (async () => {
    try {
      progress("renderer started");
      const cycles = [];
      cycles.push(await runLatestFrameCadenceCycle());
      cycles.push(await runCycle(640, 480, 1));
      cycles.push(await runCycle(640, 480, 2));
      cycles.push(await runCycle(480, 640, 3));
      cycles.push(await runCycle(702, 1280, 4));
      cycles.push(await runCycle(1500, 2000, 5));
      cycles.push(await runCycle(2400, 3200, 6));
      for (let cycle = 7; cycle <= 12; cycle += 1) {
        cycles.push(await runCycle(640, 480, cycle));
      }
      ipcRenderer.send("smoke-result", { ok: true, cycles });
    } catch (error) {
      ipcRenderer.send("smoke-result", {
        ok: false,
        error: String(error?.stack || error),
      });
    }
  })();
</script>
